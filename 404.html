<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Wisteria Trust</title>
  <link rel="icon" type="image/png" href="/assets/images/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .notfound-wrapper {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
      background: radial-gradient(circle at 50% 30%, rgba(197, 160, 89, 0.08) 0%, #0d0e12 70%);
      color: #f5f5f7;
    }
    .notfound-code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(5rem, 15vw, 9rem);
      font-weight: 700;
      line-height: 1;
      background: linear-gradient(135deg, #d4af37 0%, #ffffff 50%, #aa820a 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }
    .notfound-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(1.5rem, 3vw, 2.25rem);
      margin-bottom: 1rem;
      color: #e5e5e7;
    }
    .notfound-desc {
      font-family: 'Manrope', sans-serif;
      font-size: 1rem;
      color: #86868b;
      max-width: 480px;
      margin-bottom: 2.5rem;
      line-height: 1.6;
    }
    .notfound-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.85rem 2rem;
      background: linear-gradient(135deg, #c5a059 0%, #9e7d3b 100%);
      color: #0b0c10;
      font-weight: 700;
      font-size: 0.95rem;
      border-radius: 9999px;
      text-decoration: none;
      box-shadow: 0 8px 24px rgba(197, 160, 89, 0.25);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .notfound-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(197, 160, 89, 0.35);
    }
  </style>
</head>
<body class="dark-theme">
  <div class="notfound-wrapper">
    <div class="notfound-code">404</div>
    <h1 class="notfound-title">Institutional Record Not Found</h1>
    <p class="notfound-desc">
      The registry entry or page you requested does not exist or has been relocated within the Wisteria Trust infrastructure.
    </p>
    <a href="/" class="notfound-btn">
      <span>Return to Official Registry</span>
      <span>→</span>
    </a>
  </div>
</body>
</html>
